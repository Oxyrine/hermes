[project]
name = "hermes"
version = "0.0.0"
description = "Evidence, pricing and servicing layer between MSME suppliers and regulated lenders"
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.9.0",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
