[project]
name = "hermes"
version = "0.0.0"
description = "Evidence, pricing and servicing layer between MSME suppliers and regulated lenders"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fpdf2>=2.9.0",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "reportlab>=5.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pixeltable-pgserver>=0.7.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"  # live-model runs are manual: `uv run pytest -m live`
markers = ["live: calls the real Gemini API with the key in .env; manual, never in CI"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/hermes/api.py" = ["B008"]  # FastAPI's Depends()/Body() defaults
