name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # No model calls and no API key: tests use fixtures and a fake model.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
